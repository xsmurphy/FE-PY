# docker-compose para desarrollo local.
#
# IMPORTANTE: correr desde el ROOT del repo, no desde api/:
#   docker compose -f api/docker-compose.yml up
#
# Esto es porque el build context del Dockerfile es el root (api/ es subdir)
# y el Dockerfile necesita acceder a ../src, ../dist, ../xsd, ../xsd-unsigned
# del motor xmlgen.
#
# Variables de entorno:
#   MASTER_KEY_BASE64 debe estar exportada en el shell o en un .env al lado.
#   Generar con: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/facturacion
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: facturacion-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      MASTER_KEY_BASE64: ${MASTER_KEY_BASE64:?MASTER_KEY_BASE64 is required}
      ENABLE_SIFEN: "false"
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Worker de BullMQ (Batch 7) — solo arranca si ENABLE_WORKERS=true
  # Comentar el servicio si no querés correr workers en dev local
  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/facturacion
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: facturacion-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      MASTER_KEY_BASE64: ${MASTER_KEY_BASE64:?MASTER_KEY_BASE64 is required}
      ENABLE_SIFEN: "false"
    command: ["worker"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    profiles:
      - workers

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: facturacion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/facturacion-dev || true;
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
